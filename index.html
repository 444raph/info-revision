    <script>
        // DONNÉES DU COURS (DÉTAILLÉES ET SANS CROCHETS DE CITATION)
        const chapters = [
            {
                title: "Git : Concepts et Configuration",
                icon: "fa-code-branch",
                color: "border-orange-500",
                bg: "bg-orange-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">Qu'est-ce que Git ?</b> Créé par Linus Torvalds en 2005, c'est un système de contrôle de version décentralisé permettant le suivi des modifications et le travail collaboratif.</li>
                        <li><b class="text-slate-900">Configuration Initiale :</b>
                            <br>• <code>git config --global user.name "Votre Nom"</code>
                            <br>• <code>git config --global user.email "votre.email@example.com"</code>
                            <br>• <code>git config --global init.defaultBranch main</code>
                            <br>• Création de clé SSH : <code>ssh-keygen</code> (génère <code>id_rsa</code> secrète et <code>id_rsa.pub</code> publique à ajouter sur GitLab).
                        </li>
                        <li><b class="text-slate-900">Le Commit :</b> Un commit est une capture (état) des fichiers identifiée par un hash SHA-1 de 20 octets. Il contient : Qui (auteur), Quand (horodatage), Quoi (modifications), Où (parent), Pourquoi (message descriptif).</li>
                        <li><b class="text-slate-900">Cycle de vie (Working Tree) :</b>
                            <br>1. <b>Untracked :</b> Fichier non suivi.
                            <br>2. <b>Staged :</b> Ajouté à l'index via <code>git add</code>.
                            <br>3. <b>Committed :</b> Validé via <code>git commit</code>.
                        </li>
                    </ul>
                `
            },
            {
                title: "Git : Commandes et Branches",
                icon: "fa-terminal",
                color: "border-blue-500",
                bg: "bg-blue-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">Commandes courantes :</b>
                            <br>• <code>git init</code> : Initialise un dépôt local.
                            <br>• <code>git status</code> : Vérifie l'état (fichiers untracked/staged).
                            <br>• <code>git diff</code> : Affiche les différences de code.
                            <br>• <code>git log --graph</code> : Affiche l'historique de manière visuelle.
                        </li>
                        <li><b class="text-slate-900">Gestion des Branches :</b>
                            <br>• <code>git branch &lt;nom&gt;</code> ou <code>git checkout -b</code> (ou <code>switch -c</code>) : Créer une branche.
                            <br>• <code>git merge &lt;nom&gt;</code> : Fusionner. En cas de conflit, édition manuelle puis nouveau commit de résolution.
                            <br>• <code>git branch -d</code> : Suppression sécurisée (refuse si non mergée). <code>-D</code> force la suppression.
                        </li>
                        <li><b class="text-slate-900">Stash (Mise de côté) :</b>
                            <br>• <code>git stash</code> : Met de côté les modifs non commitées pour changer de branche.
                            <br>• <code>git stash pop / drop / list</code> : Applique et supprime / Supprime / Liste.
                        </li>
                        <li><b class="text-slate-900">Corrections :</b>
                            <br>• <code>git reset --hard &lt;commit&gt;</code> : Destructif (réécrit l'historique).
                            <br>• <code>git revert &lt;commit&gt;</code> : Crée un commit d'annulation (sûr).
                            <br>• <code>git reflog</code> : Journal local des déplacements (filet de sécurité).
                        </li>
                    </ul>
                `
            },
            {
                title: "Agilité : Manifeste et Approches",
                icon: "fa-rotate",
                color: "border-emerald-500",
                bg: "bg-emerald-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">Le Manifeste Agile (2001) :</b> 4 valeurs fondamentales :
                            <br>1. <b>Individus et interactions</b> > Processus et outils.
                            <br>2. <b>Logiciels fonctionnels</b> > Documentation exhaustive.
                            <br>3. <b>Collaboration avec le client</b> > Négociation contractuelle.
                            <br>4. <b>Adaptation au changement</b> > Suivi d'un plan figé.
                        </li>
                        <li><b class="text-slate-900">Agile vs Cycle en V :</b> Le cycle en V est séquentiel (difficile d'intégrer des changements). L'Agilité est itérative et incrémentale (livraisons fréquentes, client impliqué en continu).</li>
                        <li><b class="text-slate-900">L'approche Kanban :</b>
                            <br>• Flux continu (sans sprints fixes) via un tableau (A faire > En cours > En revue > Terminé).
                            <br>• Repose sur les <b>WIP limits</b> (Work In Progress) pour limiter le travail simultané et éviter la surcharge.
                        </li>
                    </ul>
                `
            },
            {
                title: "Scrum et Intégration GitLab",
                icon: "fa-people-group",
                color: "border-teal-500",
                bg: "bg-teal-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">3 Rôles Scrum :</b> Product Owner (PO : besoin, priorise backlog), Scrum Master (facilite, lève les blocages), Équipe de développement (réalise le travail).</li>
                        <li><b class="text-slate-900">Artefacts Scrum :</b> 
                            <br>• <i>Product Backlog</i> : Liste priorisée de toutes les fonctionnalités attendues.
                            <br>• <i>Sprint Backlog</i> : Sélection pour le sprint en cours.
                            <br>• <i>Incrément</i> : Résultat livrable.
                        </li>
                        <li><b class="text-slate-900">4 Cérémonies Scrum :</b> Sprint Planning (choix des tâches), Daily Scrum (15min de synchro), Sprint Review (démo au client), Retrospective (bilan d'amélioration).</li>
                        <li><b class="text-slate-900">User Story & Qualité :</b>
                            <br>• <i>Format</i> : "En tant que [rôle], je veux [fonctionnalité] afin de [bénéfice]".
                            <br>• <i>DoR (Definition of Ready)</i> : Claire, estimée.
                            <br>• <i>DoD (Definition of Done)</i> : Critères d'acceptation cochés, tests passés, code relu.
                        </li>
                        <li><b class="text-slate-900">GitLab Agile :</b> User Stories = <i>Issues</i>, Sprints = <i>Milestones</i>, Tableau Kanban = <i>Boards/Labels</i>. Un commit contenant <code>Closes #id</code> ferme l'issue automatiquement.</li>
                    </ul>
                `
            },
            {
                title: "Docker : Architecture et Conteneurs",
                icon: "fa-box",
                color: "border-sky-500",
                bg: "bg-sky-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">Conteneur vs VM :</b> Un conteneur est une unité d'exécution isolée et légère. Contrairement à une VM, il n'a pas d'OS complet et partage le noyau (kernel) du système Linux hôte. Réduit les conflits d'environnement.</li>
                        <li><b class="text-slate-900">L'Image :</b> Modèle immuable et stratifié utilisé pour exécuter les conteneurs. Stockée sur des registres comme Docker Hub.</li>
                        <li><b class="text-slate-900">Commandes vitales :</b>
                            <br>• <code>docker run &lt;image&gt;</code> : Crée et démarre.
                            <br>• <code>docker ps -a</code> : Liste tous les conteneurs (même arrêtés).
                            <br>• <code>docker exec -it &lt;id&gt; bash</code> : Entre dans le terminal du conteneur.
                        </li>
                        <li><b class="text-slate-900">Options de 'run' :</b> 
                            <br>• <code>-d</code> : Detached (tâche de fond).
                            <br>• <code>--rm</code> : Supprime le conteneur à l'arrêt.
                            <br>• <code>-p 8080:80</code> : Port hôte 8080 lié au port conteneur 80.
                            <br>• <code>-v "$(pwd)":/app</code> : Volume pour persister les données.
                        </li>
                    </ul>
                `
            },
            {
                title: "Dockerfile & Docker Compose",
                icon: "fa-cubes",
                color: "border-indigo-500",
                bg: "bg-indigo-50",
                content: `
                    <ul class="space-y-3 text-sm text-slate-700">
                        <li><b class="text-slate-900">Dockerfile (Construction d'image) :</b> Construit avec <code>docker build -t &lt;nom&gt; .</code>
                            <br>• <code>FROM</code> : Image de base (ex: ubuntu, nginx:alpine).
                            <br>• <code>WORKDIR</code> : Répertoire de travail dans le conteneur.
                            <br>• <code>COPY</code> : Copie un fichier hôte vers l'image.
                            <br>• <code>RUN</code> : Exécute une commande à la construction (ex: apt update).
                            <br>• <code>EXPOSE</code> : Documente le port utilisé.
                            <br>• <code>CMD</code> : Commande par défaut au lancement.
                        </li>
                        <li><b class="text-slate-900">Docker Compose (Multi-conteneurs) :</b> Fichier <code>compose.yaml</code> contenant :
                            <br>• <code>services</code> : (web, db, etc.)
                            <br>• <code>ports</code>, <code>volumes</code>, <code>networks</code>, <code>environment</code>.
                            <br>• <code>docker compose up -d</code> : Construit/démarre.
                            <br>• <code>docker compose down</code> : Arrête proprement.
                            <br>• <code>docker compose logs &lt;service&gt;</code> : Diagnostique.
                        </li>
                    </ul>
                `
            }
        ];

        // 100 QUESTIONS DU QUIZ
        const fullQuizPool = [
            // --- GIT (33 questions) ---
            { q: "Qui a créé Git et en quelle année ?", options: ["Bill Gates en 2000", "Linus Torvalds en 2005", "Steve Jobs en 2007", "Google en 2010"], correct: 1, explanation: "Git a été créé par Linus Torvalds en 2005 pour gérer le développement du noyau Linux." },
            { q: "Qu'est-ce qu'un commit dans Git ?", options: ["Un dossier partagé", "Une capture de l'état des fichiers à un instant donné", "Un message d'erreur", "Une branche de développement"], correct: 1, explanation: "Un commit est une photographie (capture) de l'état du dépôt. Il génère un identifiant unique SHA-1." },
            { q: "Comment définir son email global dans Git ?", options: ["git config --global user.email", "git setup email", "git email --set", "git init email"], correct: 0, explanation: "La commande est 'git config --global user.email \"mon.email\"'." },
            { q: "Que fait la commande 'git init' ?", options: ["Elle supprime un dépôt", "Elle télécharge un dépôt", "Elle initialise un nouveau dépôt Git local", "Elle crée un commit"], correct: 2, explanation: "git init crée le dossier caché .git et initialise le suivi." },
            { q: "Dans le cycle de vie, que signifie l'état 'Staged' ?", options: ["Le fichier est ignoré", "Le fichier est ajouté à l'index, prêt à être commité", "Le fichier est en conflit", "Le fichier est poussé sur le serveur"], correct: 1, explanation: "L'état Staged est atteint après avoir fait 'git add'. Le fichier est prêt pour le commit." },
            { q: "Que fait 'git add .' ?", options: ["Ajoute tous les fichiers modifiés et nouveaux à l'index", "Commit tous les fichiers", "Annule les modifications", "Pousse vers GitLab"], correct: 0, explanation: "Le point '.' cible le répertoire courant et ajoute tous les changements à la zone d'index (Staged)." },
            { q: "Quelle information n'est PAS contenue dans un commit ?", options: ["L'auteur", "La date", "La météo locale", "Le message descriptif"], correct: 2, explanation: "Un commit contient Qui, Quand, Quoi, Où (parent) et Pourquoi (message)." },
            { q: "Que fait 'git status' ?", options: ["Affiche l'historique", "Vérifie l'état du dépôt et des fichiers", "Valide un fichier", "Supprime une branche"], correct: 1, explanation: "git status permet de voir les fichiers untracked, modifiés, et staged." },
            { q: "A quoi sert 'git log' ?", options: ["A se connecter à GitLab", "A afficher l'historique des commits", "A afficher le code d'un fichier", "A créer un fichier de log texte"], correct: 1, explanation: "git log liste l'historique des commits de la branche courante." },
            { q: "Que fait 'git diff' ?", options: ["Change de branche", "Affiche les différences entre les fichiers", "Fusionne deux branches", "Supprime les différences"], correct: 1, explanation: "git diff montre les lignes ajoutées/supprimées qui ne sont pas encore dans l'index." },
            { q: "A quoi sert 'git stash' ?", options: ["A supprimer le projet", "A mettre de côté les modifications non commitées", "A valider un commit", "A créer un tag"], correct: 1, explanation: "git stash sauvegarde temporairement les changements locaux pour retrouver un état propre." },
            { q: "Comment récupérer les modifications mises de côté par stash et les retirer de la liste ?", options: ["git stash apply", "git stash pop", "git stash drop", "git stash clear"], correct: 1, explanation: "git stash pop réapplique les changements et supprime l'entrée du stash." },
            { q: "Quelle commande crée une nouvelle branche ?", options: ["git branch <nom>", "git new <nom>", "git create <nom>", "git add-branch <nom>"], correct: 0, explanation: "git branch <nom> crée la branche. On peut aussi utiliser 'git checkout -b' ou 'git switch -c'." },
            { q: "Comment changer de branche (nouvelle commande Git recommandée) ?", options: ["git jump", "git move", "git switch", "git change"], correct: 2, explanation: "Depuis Git 2.23, 'git switch' est recommandé à la place de 'git checkout' pour changer de branche." },
            { q: "Que fait 'git merge feature' depuis la branche main ?", options: ["Supprime la branche feature", "Intègre la branche feature dans main", "Copie main dans feature", "Annule les commits de feature"], correct: 1, explanation: "git merge fusionne l'historique de la branche cible dans la branche courante." },
            { q: "Quelle option supprime une branche de façon forcée (même non mergée) ?", options: ["-d", "-f", "-D", "-rm"], correct: 2, explanation: "L'option -D (majuscule) force la suppression, contrairement au -d (minuscule) qui vérifie le merge." },
            { q: "Quelle convention de nommage est typique pour corriger un bug urgent ?", options: ["feature/bug", "hotfix/erreur", "docs/bug", "urgent-bug"], correct: 1, explanation: "On utilise généralement le préfixe hotfix/ ou fix/ pour les corrections." },
            { q: "Que se passe-t-il si un conflit survient lors d'un merge ?", options: ["Git choisit la version la plus récente", "Git annule le merge", "Git demande une résolution manuelle", "Le fichier est supprimé"], correct: 2, explanation: "Git insère des marqueurs de conflit dans les fichiers. L'utilisateur doit choisir et refaire un commit." },
            { q: "Que fait 'git push' ?", options: ["Récupère les commits", "Pousse les commits locaux vers le dépôt distant", "Supprime les commits", "Fusionne les branches"], correct: 1, explanation: "git push envoie vos commits validés localement vers le serveur distant (ex: GitLab)." },
            { q: "Que fait 'git pull' ?", options: ["Envoie le code", "Récupère les mises à jour distantes et les fusionne", "Annule le dernier commit", "Met en pause le dépôt"], correct: 1, explanation: "git pull est l'équivalent de faire un git fetch suivi d'un git merge." },
            { q: "Que permet la commande 'ssh-keygen' en rapport avec GitLab ?", options: ["De créer un dépôt", "De générer une paire de clés SSH pour s'authentifier sans mot de passe", "De chiffrer les commits", "De bloquer un utilisateur"], correct: 1, explanation: "Elle génère id_rsa (privée) et id_rsa.pub (publique) à ajouter dans GitLab." },
            { q: "Dans quel fichier se trouve la clé publique générée par défaut ?", options: ["id_rsa", "id_rsa.pub", "key.ssh", "public.key"], correct: 1, explanation: "Le fichier avec l'extension .pub contient la clé publique à copier dans GitLab." },
            { q: "Que fait 'git reset --hard <commit>' ?", options: ["Consulte le commit sans rien casser", "Ramène la branche au commit spécifié et détruit les modifications ultérieures", "Crée un commit d'annulation", "Met en stash les modifications"], correct: 1, explanation: "C'est une commande destructive qui réécrit l'histoire locale." },
            { q: "Quelle commande annule les effets d'un commit en créant un nouveau commit 'inverse' (sans détruire l'historique) ?", options: ["git reset", "git revert", "git remove", "git undo"], correct: 1, explanation: "git revert est sûr pour annuler des choses déjà poussées, car il n'altère pas l'historique passé." },
            { q: "Quel est le rôle de 'git reflog' ?", options: ["Voir les logs serveur", "C'est un filet de sécurité qui liste tous les déplacements récents de HEAD", "Nettoyer le dépôt", "Réparer les fichiers corrompus"], correct: 1, explanation: "Reflog garde une trace locale de vos actions (même les reset --hard), permettant de rattraper une erreur." },
            { q: "A quoi sert une 'Merge Request' dans GitLab ?", options: ["A supprimer le projet", "A demander l'intégration d'une branche avec vérification par les pairs", "A demander une augmentation", "A signaler un bug serveur"], correct: 1, explanation: "La Merge Request (ou Pull Request) permet la revue de code avant de fusionner." },
            { q: "Dans GitLab, comment fermer automatiquement l'issue #42 via un commit ou une MR ?", options: ["Finish #42", "End 42", "Closes #42", "Done #42"], correct: 2, explanation: "Des mots-clés comme 'Closes #id', 'Fixes #id' ou 'Resolves #id' ferment l'issue au moment du merge." },
            { q: "Qu'est-ce que l'état 'detached HEAD' ?", options: ["La branche est supprimée", "On est placé sur un commit spécifique sans être sur une branche active", "Git a planté", "Le commit n'a pas de parent"], correct: 1, explanation: "Cela arrive quand on fait un checkout sur un ID de commit. On peut regarder, mais pas commiter en sécurité." },
            { q: "Quelle option de git clone télécharge un projet existant ?", options: ["Aucune, c'est le comportement par défaut de git clone", "-download", "--get", "-pull"], correct: 0, explanation: "La syntaxe est juste 'git clone <url>'." },
            { q: "Dans GitLab, qu'est-ce qu'une 'Issue' ?", options: ["Un commit raté", "Un outil de suivi de tâche/bug/fonctionnalité", "Une branche", "Un dépôt"], correct: 1, explanation: "Les Issues permettent de gérer les tâches et tickets du projet." },
            { q: "A quoi correspondent les 'Labels' dans le board GitLab ?", options: ["Aux mots de passe", "Aux colonnes ou catégories (to-do, doing, bug, etc.)", "Aux noms des branches", "Aux utilisateurs"], correct: 1, explanation: "Les labels permettent de catégoriser les issues et de créer les colonnes Kanban du Board." },
            { q: "Où se trouve le fichier de configuration local d'un dépôt Git ?", options: ["Dans .git/config", "Dans git.ini", "Dans /etc/git", "Dans README.md"], correct: 0, explanation: "Toute la configuration locale (y compris les remotes) se trouve dans le dossier caché .git." },
            { q: "Que signifie 'origin' dans Git ?", options: ["Le premier commit", "Le nom par défaut donné au dépôt distant principal", "La branche main", "Le créateur du projet"], correct: 1, explanation: "origin est un alias conventionnel pour l'URL du dépôt distant." },

            // --- AGILE (33 questions) ---
            { q: "En quelle année a été formalisé le Manifeste Agile ?", options: ["1995", "1999", "2001", "2010"], correct: 2, explanation: "Le manifeste Agile a été rédigé en 2001 par 17 experts en développement logiciel." },
            { q: "Quelle est l'une des 4 valeurs du manifeste Agile ?", options: ["Les outils plus que les individus", "L'adaptation au changement plus que le suivi d'un plan", "La documentation plus que le logiciel", "La négociation plus que la collaboration"], correct: 1, explanation: "L'Agilité privilégie la flexibilité et l'adaptation face aux imprévus." },
            { q: "Quelle méthode est qualifiée de rigide par rapport à l'Agilité ?", options: ["Scrum", "Le cycle en V", "Kanban", "Extreme Programming"], correct: 1, explanation: "Le cycle en V est séquentiel et intègre difficilement les changements en cours de route." },
            { q: "Dans Scrum, qu'est-ce qu'un Sprint ?", options: ["Une course de vitesse", "Un cycle court itératif (généralement 1 à 4 semaines)", "Une réunion", "Un document technique"], correct: 1, explanation: "Le Sprint est la boîte de temps durant laquelle on crée un incrément du produit." },
            { q: "Qui est responsable de maximiser la valeur du produit dans Scrum ?", options: ["Le Scrum Master", "L'équipe de développement", "Le Product Owner (PO)", "Le client final"], correct: 2, explanation: "Le Product Owner représente le besoin métier et gère les priorités du Product Backlog." },
            { q: "Quel est le rôle du Scrum Master ?", options: ["Donner des ordres à l'équipe", "Faciliter le processus Scrum et lever les obstacles", "Coder les parties complexes", "Rédiger le cahier des charges"], correct: 1, explanation: "Le Scrum Master est un leader-serviteur qui s'assure que Scrum est compris et appliqué." },
            { q: "Qu'est-ce que le Product Backlog ?", options: ["La liste des bugs", "Le cahier des charges figé", "La liste priorisée de toutes les fonctionnalités attendues", "Le code source"], correct: 2, explanation: "Il évolue constamment et contient tout ce qui pourrait être nécessaire au produit." },
            { q: "Qu'est-ce que le Sprint Backlog ?", options: ["Le sous-ensemble du Product Backlog sélectionné pour le sprint en cours", "L'historique des anciens sprints", "Le backlog refusé par le PO", "Le planning des congés"], correct: 0, explanation: "C'est l'engagement de l'équipe pour le Sprint actuel." },
            { q: "Quel est l'objectif principal à la fin d'un Sprint ?", options: ["Mettre à jour la documentation", "Livrer un incrément de produit potentiellement utilisable", "Faire une pause", "Commencer un nouveau projet"], correct: 1, explanation: "A la fin d'un sprint, l'équipe doit fournir un bout de logiciel testé et fonctionnel." },
            { q: "Que fait-on lors du Sprint Planning ?", options: ["On démontre le produit", "On choisit les tâches à réaliser pour le Sprint", "On critique les collègues", "On code"], correct: 1, explanation: "Le Sprint Planning définit le but du Sprint et sélectionne les éléments du Product Backlog." },
            { q: "Quelle est la durée et le but du Daily Scrum (Stand-up) ?", options: ["1h pour coder", "15 minutes pour synchroniser l'équipe et lever les blocages", "30 minutes pour parler avec le client", "5 minutes pour boire un café"], correct: 1, explanation: "C'est un point quotidien rapide : 'Qu'ai-je fait, que vais-je faire, quels blocages ?'." },
            { q: "Quelle cérémonie permet de montrer le travail réalisé au client / PO ?", options: ["La Rétrospective", "Le Daily", "La Sprint Review (Revue)", "Le Sprint Planning"], correct: 2, explanation: "La Sprint Review, en fin de sprint, inspecte l'incrément et adapte le Product Backlog si besoin." },
            { q: "A quoi sert la Sprint Retrospective ?", options: ["A féliciter le PO", "A faire le bilan d'équipe sur les processus et s'améliorer pour le sprint suivant", "A relire le code source", "A re-tester le produit"], correct: 1, explanation: "La rétro inspecte le 'comment' on a travaillé (interactions, outils) pour s'améliorer en continu." },
            { q: "Quel est le format typique d'une User Story ?", options: ["Si... Alors...", "En tant que [rôle], je veux [fonctionnalité] afin de [bénéfice]", "Il faut que la machine fasse [action]", "Fonctionnalité #1 : description"], correct: 1, explanation: "Ce format recentre le besoin sur l'utilisateur final et la valeur apportée." },
            { q: "Qu'est-ce qui accompagne obligatoirement une User Story pour valider qu'elle est finie ?", options: ["Des critères d'acceptation", "Une signature en 3 exemplaires", "Un diagramme UML", "Un rapport de 10 pages"], correct: 0, explanation: "Les critères d'acceptation (souvent une liste de cases à cocher) définissent le périmètre exact de la tâche." },
            { q: "Quelle est la principale différence visuelle de Kanban par rapport à Scrum ?", options: ["Il n'y a pas d'équipe", "Le flux de travail est continu sur un tableau, sans sprints fixes", "On utilise des cartes à puce", "On ne code pas"], correct: 1, explanation: "Kanban gère un flux continu d'A faire jusqu'à Terminé, souvent en limitant le WIP." },
            { q: "Dans Kanban, que signifie 'WIP limit' ?", options: ["Work In Progress limit : on limite le nombre de tâches en cours simultanément", "Work Is Perfect : le code doit être parfait", "Without Internet Protocol", "Warning In Production"], correct: 0, explanation: "Limiter le WIP évite les goulots d'étranglement et force l'équipe à terminer une tâche avant d'en commencer une autre." },
            { q: "Comment matérialise-t-on un Sprint dans l'outil GitLab ?", options: ["Avec un fichier texte", "Avec une Milestone (Jalon)", "Avec un tag Git", "Avec un commit"], correct: 1, explanation: "Les Milestones de GitLab, avec une date de début et de fin, sont parfaites pour simuler des Sprints." },
            { q: "Dans GitLab, comment créer un Board type Kanban ?", options: ["C'est impossible", "En créant des Labels (tags) qui deviendront les colonnes", "En payant l'option Premium", "En utilisant l'outil Wiki"], correct: 1, explanation: "Dans Issues > Boards, les listes sont basées sur les Labels de votre projet." },
            { q: "Qu'est-ce que la Definition of Done (DoD) ?", options: ["La date de fin du projet", "Une check-list des critères pour considérer qu'une issue est totalement terminée et livrable", "Le salaire de fin de mois", "La fermeture de GitLab"], correct: 1, explanation: "La DoD assure la qualité : critères d'acceptation ok, code relu, tests passés, pas de régressions." },
            { q: "Qu'est-ce que la Definition of Ready (DoR) ?", options: ["Quand le café est prêt", "Les critères pour qu'une tâche puisse entrer dans un Sprint (claire, petite, estimée)", "La commande pour démarrer Docker", "Le lancement du Daily"], correct: 1, explanation: "La DoR évite d'embarquer dans un Sprint des tâches trop floues ou irréalisables." },
            { q: "Que prône le manifeste Agile sur la documentation ?", options: ["Elle est interdite", "Un logiciel fonctionnel prime sur une documentation exhaustive", "Elle doit faire 100 pages minimum", "Elle remplace le code"], correct: 1, explanation: "L'Agilité ne rejette pas la doc, mais refuse qu'elle devienne un frein au développement du produit." },
            { q: "En Agilité, quand le client est-il impliqué ?", options: ["Au début pour le contrat, et à la fin pour payer", "Uniquement lors du procès en cas d'échec", "En continu tout au long du développement (feedback régulier)", "Jamais"], correct: 2, explanation: "L'implication continue permet de s'assurer que le produit développé correspond au vrai besoin." },
            { q: "Qu'est-ce qu'une tâche de type 'chore' ou technique ?", options: ["Une user story métier", "Une tâche invisible pour l'utilisateur mais nécessaire (ex: refactoring, CI/CD)", "Un bug", "Une réunion"], correct: 1, explanation: "Ces tâches maintiennent la santé du projet sans apporter de fonctionnalité métier directe." },
            { q: "Dans une User Story, à quoi sert le 'afin de' ?", options: ["A faire joli", "A comprendre la motivation/le bénéfice pour l'utilisateur", "A justifier le budget", "A décrire le code"], correct: 1, explanation: "Comprendre le bénéfice permet aux développeurs de proposer parfois des solutions techniques plus pertinentes." },
            { q: "Que signifie Scrumban ?", options: ["Un personnage de jeu vidéo", "Un mélange entre les sprints de Scrum et le flux visuel/WIP de Kanban", "Une interdiction de faire du Scrum", "Une méthode du cycle en V"], correct: 1, explanation: "Scrumban combine la structure des cérémonies Scrum avec le management visuel de Kanban." },
            { q: "Dans GitLab, dans quelle colonne place-t-on une nouvelle Issue non planifiée ?", options: ["Doing", "Done", "Backlog (Open)", "Closed"], correct: 2, explanation: "Les nouvelles idées atterrissent dans le backlog en attendant d'être priorisées et planifiées." },
            { q: "Dans le TP, qu'est-ce qui indique qu'une issue est en cours de relecture ?", options: ["La colonne check (ou revue) liée à une Merge Request ouverte", "L'issue est supprimée", "Le label bug", "La couleur rouge"], correct: 0, explanation: "L'issue passe en revue le temps qu'un pair lise le code de la Merge Request." },
            { q: "Faut-il modifier une User Story pendant qu'elle est en cours (doing) ?", options: ["Oui, tous les jours", "Non, le périmètre d'une story engagée dans le sprint doit rester stable", "Seulement si le développeur a envie", "Oui, pour ajouter plein de choses"], correct: 1, explanation: "Si le besoin change fondamentalement, on ferme la story ou on la repousse au sprint suivant." },
            { q: "Qu'est-ce qu'un Burndown Chart ?", options: ["Un graphique de température des serveurs", "Un graphique montrant le travail restant au fil du temps dans un sprint", "Un outil pour incendier les collègues", "Le bilan financier"], correct: 1, explanation: "Il permet de voir si l'équipe est sur la bonne voie pour finir tout ce qu'elle a prévu dans le sprint." },
            { q: "Que fait le PO si un incrément présenté en Review n'est pas du tout satisfaisant ?", options: ["Il licencie l'équipe", "Il le refuse et l'élément retourne dans le backlog pour être corrigé", "Il le met en production quand même", "Il modifie l'historique Git"], correct: 1, explanation: "Le PO a le dernier mot pour valider ou refuser si les critères d'acceptation ne sont pas atteints." },
            { q: "En Agile, qui estime la difficulté des tâches (User Stories) ?", options: ["Le client", "Le Scrum Master", "L'équipe de développement, car c'est elle qui va faire le travail", "Le Product Owner"], correct: 2, explanation: "L'équipe technique est la mieux placée pour estimer l'effort (souvent en points d'histoire)." },
            { q: "Pourquoi l'Agilité parle-t-elle de développement 'itératif et incrémental' ?", options: ["Parce qu'on recommence tout à zéro chaque mois", "Parce qu'on construit le produit par petits morceaux successifs et fonctionnels", "C'est juste du jargon marketing", "Pour augmenter le prix"], correct: 1, explanation: "Chaque sprint ajoute un incrément (morceau fonctionnel) au produit existant, itération après itération." },

            // --- DOCKER (34 questions) ---
            { q: "Quelle est la principale différence entre un Conteneur et une Machine Virtuelle (VM) ?", options: ["La VM est plus légère", "Le conteneur partage le noyau de l'hôte, il n'embarque pas d'OS complet", "Le conteneur nécessite un écran", "Il n'y a aucune différence"], correct: 1, explanation: "Les conteneurs sont beaucoup plus légers car ils mutualisent le kernel de la machine hôte." },
            { q: "Qu'est-ce qu'une image Docker ?", options: ["Une photo JPEG", "Un modèle immuable et stratifié servant à créer des conteneurs", "Un serveur physique", "Une sauvegarde de base de données"], correct: 1, explanation: "L'image est un template read-only (ex: ubuntu, nginx). Le conteneur est l'instance exécutée de cette image." },
            { q: "Que fait la commande 'docker run hello-world' ?", options: ["Elle installe Linux", "Elle cherche l'image locale ou la télécharge, crée le conteneur et l'exécute", "Elle affiche Hello World en boucle", "Elle supprime tous les conteneurs"], correct: 1, explanation: "run combine pull (si image absente), create et start." },
            { q: "Pourquoi l'image 'hello-world' n'apparaît pas dans 'docker ps' après son exécution ?", options: ["C'est un bug", "Parce que le conteneur s'arrête de lui-même dès que son processus principal est terminé", "Parce que Docker crash", "Parce qu'elle est invisible"], correct: 1, explanation: "docker ps n'affiche que les conteneurs *en cours d'exécution*." },
            { q: "Comment lister TOUS les conteneurs, même ceux qui sont arrêtés ?", options: ["docker ps --all", "docker ls", "docker ps -a", "docker containers list"], correct: 2, explanation: "Le drapeau -a (ou --all) permet de voir l'historique des conteneurs stoppés." },
            { q: "A quoi sert l'option '-d' dans docker run ?", options: ["Delete (Supprimer)", "Detached (Lancer en tâche de fond)", "Download (Télécharger)", "Debug (Mode verbeux)"], correct: 1, explanation: "Le mode detached permet de rendre la main au terminal pendant que le conteneur tourne en arrière-plan." },
            { q: "Que signifie le mappage de port '-p 8080:80' ?", options: ["Le port 80 de l'hôte redirige vers le port 8080 du conteneur", "Le port 8080 de l'hôte redirige vers le port 80 du conteneur", "Ferme le port 8080", "Multiplie les ports"], correct: 1, explanation: "La syntaxe est toujours : <port_hôte>:<port_conteneur>." },
            { q: "Comment supprimer un conteneur ?", options: ["docker delete <id>", "docker rm <id>", "docker erase <id>", "docker remove-container <id>"], correct: 1, explanation: "La commande est 'docker rm'. Attention, le conteneur doit être stoppé avant, sauf si on force avec -f." },
            { q: "Comment supprimer une IMAGE Docker locale ?", options: ["docker rm <image>", "docker remove <image>", "docker rmi <image>", "docker drop <image>"], correct: 2, explanation: "rmi signifie 'remove image'." },
            { q: "A quoi sert l'option '-v' dans docker run ?", options: ["Volume : pour persister les données ou lier un dossier local au conteneur", "Verbose : pour afficher plus de logs", "Version : pour choisir la version de l'image", "Verify : pour vérifier le hash"], correct: 0, explanation: "Les volumes permettent aux données de survivre à la suppression du conteneur." },
            { q: "Que fait l'option '--name' dans docker run ?", options: ["Donne un nom d'utilisateur au conteneur", "Donne un nom explicite au conteneur (au lieu d'un nom aléatoire)", "Change le nom de l'image", "Crée un mot de passe"], correct: 1, explanation: "Sans --name, Docker génère des noms fantaisistes (ex: confident_turing)." },
            { q: "Que fait l'option '--rm' dans docker run ?", options: ["Redémarre le conteneur", "Supprime automatiquement le conteneur dès qu'il s'arrête", "Retire la mémoire RAM", "Remonte le temps"], correct: 1, explanation: "Très utile pour les conteneurs jetables (ex: compiler un script une seule fois)." },
            { q: "Que fait 'docker exec -it <id> bash' ?", options: ["Formate le conteneur", "Exécute un shell interactif à l'intérieur d'un conteneur en cours d'exécution", "Stoppe le processus bash", "Construit une image"], correct: 1, explanation: "Cela permet de 'rentrer' dans le conteneur pour y taper des commandes (apt, ls, nano...)." },
            { q: "Quel est l'intérêt d'un fichier 'Dockerfile' ?", options: ["Remplacer Git", "Automatiser la création d'une image personnalisée étape par étape", "Créer un virus", "Configurer le réseau Windows"], correct: 1, explanation: "Au lieu d'installer des paquets à la main, le Dockerfile script la construction de l'image (Infrastructure as Code)." },
            { q: "Dans un Dockerfile, à quoi sert l'instruction 'FROM' ?", options: ["Définir l'auteur", "Définir l'image de base (obligatoire au début)", "Lancer un téléchargement", "Copier un fichier"], correct: 1, explanation: "Chaque image s'appuie sur une image parent (ex: FROM ubuntu:20.04 ou FROM python:3.9-slim)." },
            { q: "Dans un Dockerfile, que fait l'instruction 'RUN' ?", options: ["Elle lance le conteneur", "Elle exécute une commande Linux pendant la construction de l'image (ex: apt update)", "Elle fait courir le processeur", "Elle ferme Docker"], correct: 1, explanation: "RUN ajoute une nouvelle couche à l'image avec le résultat de la commande." },
            { q: "Dans un Dockerfile, quelle est la différence entre RUN et CMD ?", options: ["Il n'y en a pas", "RUN s'exécute à la construction de l'image, CMD s'exécute par défaut au lancement du conteneur", "RUN est pour Windows, CMD pour Linux", "CMD s'exécute avant RUN"], correct: 1, explanation: "RUN prépare l'environnement (build time). CMD est l'action principale du conteneur (runtime)." },
            { q: "Dans un Dockerfile, que fait l'instruction 'COPY' ?", options: ["Copie du texte", "Copie des fichiers depuis la machine hôte vers le système de fichiers de l'image", "Copie une image entière", "Clone un dépôt Git"], correct: 1, explanation: "Utile pour injecter le code source (ex: COPY . /app) dans l'image." },
            { q: "Dans un Dockerfile, à quoi sert 'WORKDIR' ?", options: ["Définir le dossier où le code sera sauvegardé sur l'hôte", "Définir le répertoire de travail pour les instructions suivantes (RUN, CMD, COPY)", "Allumer l'écran", "Changer de disque dur"], correct: 1, explanation: "Equivalent d'un 'cd' dans le processus de construction." },
            { q: "Dans un Dockerfile, que fait 'EXPOSE 80' ?", options: ["Il publie physiquement le port sur internet", "Il documente le fait que le conteneur écoute sur le port 80", "Il bloque le port 80", "Il expose un fichier de logs"], correct: 1, explanation: "EXPOSE n'ouvre pas le port sur la machine hôte, il indique juste à l'utilisateur de l'image quel port mapper avec -p." },
            { q: "Comment construire une image à partir d'un Dockerfile dans le répertoire courant ?", options: ["docker make", "docker build -t <nom_image> .", "docker compile .", "docker run Dockerfile"], correct: 1, explanation: "Le '.' à la fin est crucial : il indique le 'contexte' de build (le dossier courant)." },
            { q: "Qu'est-ce que le Docker Hub ?", options: ["Un hub USB", "Un registre public centralisé contenant des millions d'images Docker", "Le bureau du PDG de Docker", "Une commande Git"], correct: 1, explanation: "C'est l'endroit d'où 'docker pull' ou 'FROM' télécharge les images officielles." },
            { q: "Que signifie l'erreur 'port is already allocated' ?", options: ["Le câble réseau est débranché", "Un autre service ou conteneur utilise déjà ce port de la machine hôte", "Il faut redémarrer le PC", "Docker n'a plus de RAM"], correct: 1, explanation: "Deux conteneurs ne peuvent pas utiliser le même port hôte simultanément (ex: deux fois -p 8080:80)." },
            { q: "Qu'est-ce que Docker Compose ?", options: ["Un outil de création musicale", "Un outil permettant de définir et lancer des applications multi-conteneurs via un fichier YAML", "Une alternative à Git", "Un IDE pour Python"], correct: 1, explanation: "Compose permet de lier facilement un serveur web et sa base de données, par exemple." },
            { q: "Quel format de fichier est utilisé par Docker Compose ?", options: [".xml", ".json", ".yaml / .yml", ".txt"], correct: 2, explanation: "Le fichier est généralement nommé compose.yaml ou docker-compose.yml." },
            { q: "Dans compose.yml, à quoi correspond la clé 'services' ?", options: ["Aux offres payantes", "Aux différents conteneurs qui composent l'application (web, db, etc.)", "Au réseau wifi", "Aux administrateurs"], correct: 1, explanation: "Chaque service défini sous cette clé deviendra un conteneur au lancement." },
            { q: "Quelle commande permet de démarrer tous les services d'un compose.yml en arrière-plan ?", options: ["docker compose start", "docker compose up -d", "docker run all", "compose start -b"], correct: 1, explanation: "up construit (si besoin), crée et démarre les conteneurs, réseaux et volumes définis." },
            { q: "Quelle commande arrête et supprime proprement les conteneurs et réseaux créés par compose ?", options: ["docker compose stop", "docker compose down", "docker compose kill", "docker compose rm"], correct: 1, explanation: "down est l'inverse parfait de up. Il nettoie l'environnement." },
            { q: "Pourquoi l'architecture de Docker est-elle dite 'Client/Serveur' ?", options: ["Parce qu'elle coûte cher", "Parce que la commande CLI (client) communique avec le daemon dockerd (serveur) qui fait le travail", "Parce qu'il faut internet", "Parce que c'est codé en PHP"], correct: 1, explanation: "Le client Docker envoie l'ordre au daemon (qui gère images, volumes, conteneurs)." },
            { q: "Que signifie le tag ':alpine' souvent vu sur des images (ex: nginx:alpine) ?", options: ["C'est une image pour le ski", "C'est une version allégée basée sur la distribution Linux Alpine", "C'est une version corrompue", "C'est la version bêta"], correct: 1, explanation: "Alpine est une distribution minuscule (~5Mo), idéale pour réduire la taille des images Docker." },
            { q: "Dans compose.yml, comment lier le code source de sa machine au conteneur nginx sans reconstruire l'image ?", options: ["Via la clé 'ports'", "Via la clé 'networks'", "Via la clé 'volumes' (ex: .:/usr/share/nginx/html)", "Via la clé 'image'"], correct: 2, explanation: "Le volume type 'bind mount' relie le dossier courant (.) au dossier cible dans le conteneur." },
            { q: "Que se passe-t-il si je supprime un conteneur base de données sans avoir configuré de volume ?", options: ["Les données sont conservées en cloud", "Toutes les données à l'intérieur sont définitivement perdues", "Le conteneur se recrée", "Il m'est impossible de le supprimer"], correct: 1, explanation: "Par nature, le stockage d'un conteneur est éphémère. Les volumes sont indispensables pour la persistance." },
            { q: "Comment regarder les logs d'un service spécifique géré par Compose (ex: la base de données 'db') ?", options: ["docker compose print db", "docker compose logs db", "cat db.log", "docker show db"], correct: 1, explanation: "docker compose logs <nom_service> permet de diagnostiquer ce qui se passe dans un conteneur particulier." },
            { q: "Dans le TP Docker Compose, pourquoi pgadmin4 gardait-il en mémoire la connexion au serveur ?", options: ["Grâce à la magie", "Grâce à l'utilisation d'un volume persistant pour les données de pgadmin", "Parce que le conteneur n'a jamais été éteint", "Parce que c'est un bug"], correct: 1, explanation: "Un volume nommé garantit que les configurations de l'application survivent aux cycles up/down." }
        ];

        // UI Routing
        function showSection(sectionId) {
            document.getElementById('cours-section').classList.add('hide');
            document.getElementById('quiz-section').classList.add('hide');
            document.getElementById('score-section').classList.add('hide');
            
            document.getElementById(sectionId + '-section').classList.remove('hide');
            
            // Sidebar active state
            document.getElementById('nav-cours').classList.replace('bg-brand-600', 'bg-slate-800');
            document.getElementById('nav-cours').classList.replace('text-white', 'text-slate-300');
            document.getElementById('nav-quiz').classList.replace('bg-brand-600', 'bg-slate-800');
            document.getElementById('nav-quiz').classList.replace('text-white', 'text-slate-300');
            
            if(sectionId === 'cours' || sectionId === 'quiz') {
                document.getElementById('nav-' + sectionId).classList.replace('bg-slate-800', 'bg-brand-600');
                document.getElementById('nav-' + sectionId).classList.replace('text-slate-300', 'text-white');
            }
        }

        // Initialize Course Cards
        function init() {
            const container = document.getElementById('cours-container');
            chapters.forEach(chap => {
                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-md transition-shadow relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-2 h-full ${chap.bg} border-l-4 ${chap.color}"></div>
                        <div class="ml-4">
                            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-3 border-b border-slate-100 pb-3 mb-4">
                                <span class="${chap.bg} w-10 h-10 flex justify-center items-center rounded-xl text-slate-700">
                                    <i class="fa-solid ${chap.icon}"></i>
                                </span>
                                ${chap.title}
                            </h3>
                            ${chap.content}
                        </div>
                    </div>
                `;
            });
        }

        // Quiz Logic
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function startQuiz() {
            showSection('quiz');
            // Select 10 random questions from the 100 pool
            let shuffledPool = shuffleArray([...fullQuizPool]);
            currentQuiz = shuffledPool.slice(0, 10);
            
            currentQuestionIndex = 0;
            score = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / 10`;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            
            q.options.forEach((opt, index) => {
                optionsContainer.innerHTML += `
                    <button onclick="checkAnswer(${index})" id="opt-${index}" class="quiz-btn w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 hover:border-brand-300 font-medium text-slate-700 flex items-center gap-4">
                        <span class="w-8 h-8 rounded bg-slate-100 text-slate-500 flex justify-center items-center text-sm font-bold shrink-0">${letters[index]}</span>
                        <span>${opt}</span>
                    </button>
                `;
            });

            document.getElementById('explanation-box').classList.add('hide');
        }

        function checkAnswer(selectedIndex) {
            const q = currentQuiz[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.correct);
            
            // Disable all buttons
            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50', 'hover:border-brand-300', 'quiz-btn');
                
                if (idx === q.correct) {
                    btn.classList.add('correct-ans');
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('wrong-ans');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (isCorrect) score++;

            // Show explanation
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('explanation-box').classList.remove('hide');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.length) {
                renderQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            showSection('score');
            document.getElementById('final-score').innerText = `${score} / 10`;
            
            const icon = document.getElementById('score-icon');
            const msg = document.getElementById('score-message');
            
            if (score >= 8) {
                icon.innerHTML = '🏆';
                msg.innerText = "Excellent travail ! Vous maîtrisez les concepts DevOps / Agiles !";
            } else if (score >= 5) {
                icon.innerHTML = '👍';
                msg.innerText = "Bon score, mais quelques révisions sur GitLab ou Docker seraient utiles.";
            } else {
                icon.innerHTML = '📚';
                msg.innerText = "Il va falloir relire les fiches de cours avant l'examen !";
            }
        }

        // Init app
        init();
        showSection('cours');
    </script>
</body>
</html>
